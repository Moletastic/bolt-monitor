info:
  name: Delete Notification Channel
  type: http
  seq: 7
  tags:
    - domain:channels
    - operation:delete
http:
  method: DELETE
  url: "{{apiUrl}}/api/v1/notification-channels/{{channelId}}"
docs: |-
  Purpose: Delete an unused notification channel.
  Setup: Set `channelId`; verify no policy references it.
  Expected result: Returns `204 No Content`; referenced channels return `409` error envelope with `CHANNEL_IN_USE` and `referencingRoutes`.
