info:
  name: Acknowledge Incident
  type: http
  seq: 37
  tags:
    - domain:incidents
    - operation:acknowledge
http:
  method: POST
  url: "{{apiUrl}}/api/v1/incidents/{{incidentId}}/ack"
  headers:
    - name: Idempotency-Key
      value: bruno-incident-ack-1
      enabled: true
docs: |-
  Purpose: Acknowledge an actionable incident.
  Setup: Set `incidentId` to an open incident and provide a unique Idempotency-Key.
  Expected result: Returns the acknowledged incident; retrying the same request returns that canonical result.
